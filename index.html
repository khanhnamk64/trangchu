<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRP – Nearest Insertion Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
<style>
  :root {
    --bg:      #0b0f1a;
    --surface: #111827;
    --border:  #1f2937;
    --accent:  #38bdf8;
    --text:    #e2e8f0;
    --muted:   #6b7280;
    --green:   #34d399;
    --amber:   #fbbf24;
    --red:     #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  header .sub { font-size: 11px; color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    padding: 8px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover  { opacity: .85; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  /* ── Layout ── */
  .main { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: calc(100vh - 57px); }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  .content { display: flex; flex-direction: column; overflow: visible; }

  /* ── Stats grid ── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
  .stat-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-card .unit  { font-size: 11px; color: var(--muted); }

  /* ── Canvas ── */
  .canvas-wrap { flex: 1; position: relative; padding: 16px 20px; }
  canvas#routeMap { width: 100% !important; height: 500px !important; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }

  /* ── Route list ── */
  .route-item {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
    transition: border-color .2s;
  }
  .route-item:hover { border-color: var(--green); }
  .route-title { font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .route-path  { font-size: 11px; color: var(--muted); word-break: break-all; }
  .route-meta  { display: flex; gap: 10px; margin-top: 6px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .badge-blue   { background: #1e3a5f; color: var(--accent); }
  .badge-green  { background: #14532d; color: var(--green); }

  /* ── Log panel ── */
  .log-panel { background: #0d1117; border-top: 1px solid var(--border); padding: 8px 20px; font-size: 11px; color: var(--muted); max-height: 80px; overflow-y: auto; }
  .log-ok   { color: var(--green); }
  .log-err  { color: var(--red); }
  .log-info { color: var(--accent); }

  /* ── Spinner ── */
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #374151; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Section title ── */
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
</style>
</head>
<body>

<!-- ═══ HEADER ═══════════════════════════════════════════════ -->
<header>
  <div>
    <h1>🚚 VRP Dashboard</h1>
    <div class="sub">Nearest Insertion Heuristic · C++17</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <button class="btn btn-outline" onclick="compileAndRun()">
      <span id="runSpinner" style="display:none"><span class="spinner"></span></span>
      ▶ Compile &amp; Run
    </button>
    <button class="btn btn-success" id="animateBtn" onclick="toggleAnimation()">🚗 Chạy tour</button>
    <div style="display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px">
      <label style="font-size:11px;color:var(--muted);font-weight:600">Tốc độ:</label>
      <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1" style="width:80px;cursor:pointer" onchange="updateSpeed()">
      <span id="speedValue" style="font-size:11px;color:var(--accent);font-weight:600;min-width:25px">1.0x</span>
    </div>
    <button class="btn btn-primary" onclick="loadResult()">⟳ Reload</button>
  </div>
</header>

<!-- ═══ MAIN ══════════════════════════════════════════════════ -->
<div class="main">

  <!-- Sidebar: danh sách routes -->
  <aside class="sidebar">
    <div class="section-title">Routes</div>
    <div id="routeList"><p style="color:var(--muted)">Chưa có dữ liệu.</p></div>

    <div style="margin-top:24px">
      <div class="section-title">Legend</div>
      <div id="legend"></div>
    </div>
  </aside>

  <!-- Content: stats + canvas -->
  <div class="content">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Tổng quãng đường</div>
        <div class="value" id="statDist">—</div>
        <div class="unit">đơn vị</div>
      </div>
      <div class="stat-card">
        <div class="label">Số xe sử dụng</div>
        <div class="value" id="statVeh">—</div>
        <div class="unit">xe</div>
      </div>
      <div class="stat-card">
        <div class="label">Số khách</div>
        <div class="value" id="statCust">—</div>
        <div class="unit">điểm</div>
      </div>
      <div class="stat-card">
        <div class="label">Thời gian chạy</div>
        <div class="value" id="statTime">—</div>
        <div class="unit">ms</div>
      </div>
    </div>

    <!-- Map canvas -->
    <div class="canvas-wrap">
      <canvas id="routeMap"></canvas>
      <div id="emptyMsg" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);text-align:center">
        <div style="font-size:40px">🗺</div>
        <div>Nhấn <strong style="color:var(--accent)">Compile &amp; Run</strong> để xem kết quả</div>
      </div>
      <div id="arrivalPanel" style="margin-top:16px;padding:14px 16px;background:#0d1117;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;display:none;">
        <div style="font-weight:700;color:var(--accent);margin-bottom:8px">Thời gian xe</div>
        <div id="arrivalContent" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
      </div>
    </div>

    <!-- Log -->
    <div class="log-panel" id="logPanel">
      <span class="log-info">Sẵn sàng.</span>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const COLORS = [
  '#38bdf8','#34d399','#fb923c','#a78bfa',
  '#f472b6','#facc15','#4ade80','#f87171',
  '#60a5fa','#c084fc','#fdba74','#86efac'
];
const DEPOT_COLOR = '#fbbf24';
let VEHICLE_SPEED = 0.055; // unit distance per millisecond
let speedMultiplier = 1.0;
let chartInstance = null;
let animationFrame = null;
let animationStart = null;
let routeStates = [];

const pointLabelPlugin = {
  id: 'pointLabelPlugin',
  afterDatasetsDraw(chart) {
    const {ctx} = chart;
    chart.data.datasets.forEach((dataset, datasetIndex) => {
      if (!dataset.labelPoints) return;
      const meta = chart.getDatasetMeta(datasetIndex);
      meta.data.forEach((point, index) => {
        const label = dataset.labelPoints[index];
        if (!label) return;
        const x = point.x;
        const y = point.y;
        ctx.save();
        ctx.font = '11px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.lineWidth = 3;
        ctx.strokeText(label, x + 8, y - 8);
        ctx.fillText(label, x + 8, y - 8);
        ctx.restore();
      });
    });
  }
};

// ═══════════════════════════════════════════════════════════════
//  LOGGING
// ═══════════════════════════════════════════════════════
function log(msg, cls = 'log-info') {
  const panel = document.getElementById('logPanel');
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  panel.appendChild(el);
  panel.scrollTop = panel.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════
//  RUN SOLVER
// ═══════════════════════════════════════════════════════════════
async function compileAndRun() {
  const spinner = document.getElementById('runSpinner');
  spinner.style.display = 'inline';
  log('Đang compile & chạy solver...');

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const data = await res.json();

    if (data.success) {
      log('Solver hoàn thành ✓', 'log-ok');
      if (data.stdout) log(data.stdout.trim().split('\n').pop());
      await loadResult();
    } else {
      log('Lỗi: ' + (data.error || data.stderr), 'log-err');
      if (data.stderr) log(data.stderr, 'log-err');
    }
  } catch(e) {
    log('Fetch error: ' + e.message, 'log-err');
  } finally {
    spinner.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════════
//  LOAD & RENDER
// ═══════════════════════════════════════════════════════════════
async function loadResult() {
  try {
    const res = await fetch('/api/result');
    if (!res.ok) { log('Chưa có kết quả.', 'log-err'); return; }
    const data = await res.json();
    if (data.error) { log(data.error, 'log-err'); return; }
    renderDashboard(data);
    log(`Tải kết quả thành công: ${data.routes.length} routes, dist=${data.totalCost.toFixed(2)}`, 'log-ok');
  } catch(e) {
    log('Lỗi tải result: ' + e.message, 'log-err');
  }
}

function renderDashboard(data) {
  // Stats
  document.getElementById('statDist').textContent  = data.totalCost.toFixed(2);
  document.getElementById('statVeh').textContent   = data.vehicles;
  document.getElementById('statCust').textContent  = (data.nodes || []).filter(n=>!n.isDepot).length;
  document.getElementById('statTime').textContent  = (data.elapsedMs||0).toFixed(1);
  document.getElementById('emptyMsg').style.display = 'none';

  stopAnimation();
  renderMap(data);
  renderRouteList(data);
  renderLegend(data.routes);
  updateArrivalPanel();
}

// ═══════════════════════════════════════════════════════════════
//  MAP (Canvas – Chart.js Scatter)
// ═══════════════════════════════════════════════════════════════
function formatMs(ms) {
  const seconds = Math.floor(ms / 1000);
  const millis = Math.round(ms % 1000);
  return `${seconds}.${String(millis).padStart(3, '0')}s`;
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function buildRouteStates(data) {
  return data.routes.map((route, i) => {
    const points = route.coords.map((c, idx) => ({
      ...c,
      id: route.path?.[idx] ?? null,
      label: null
    }));
    const segments = [];
    let total = 0;
    for (let j = 1; j < points.length; j++) {
      const len = distance(points[j - 1], points[j]);
      total += len;
      segments.push({ from: points[j - 1], to: points[j], len, cum: total });
    }
    const baseDuration = Math.max(1400, Math.round(total / VEHICLE_SPEED));
    const duration = Math.round(baseDuration / speedMultiplier);
    return {
      id: route.id,
      route,
      segments,
      totalDistance: total,
      baseDuration,
      duration,
      finished: false,
      finishTime: null,
      datasetIndex: null,
      position: { x: points[0].x, y: points[0].y }
    };
  }).sort((a, b) => a.totalDistance - b.totalDistance);
}

function getPositionAt(state, elapsed) {
  if (elapsed >= state.duration) {
    const last = state.segments[state.segments.length - 1];
    return { x: last.to.x, y: last.to.y };
  }
  const target = (elapsed / state.duration) * state.totalDistance;
  const segment = state.segments.find(s => s.cum >= target) || state.segments[state.segments.length - 1];
  const prevCum = segment.cum - segment.len;
  const ratio = segment.len === 0 ? 0 : (target - prevCum) / segment.len;
  return {
    x: segment.from.x + (segment.to.x - segment.from.x) * ratio,
    y: segment.from.y + (segment.to.y - segment.from.y) * ratio
  };
}

function renderMap(data) {
  const ctx = document.getElementById('routeMap').getContext('2d');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const allNodes = data.nodes || [];
  routeStates = buildRouteStates(data);
  const datasets = [];

  data.routes.forEach((route, i) => {
    const color = COLORS[i % COLORS.length];
    const routePoints = route.coords.map((c, idx) => {
      const nodeId = route.path?.[idx] ?? null;
      const node = allNodes.find(n => n.id === nodeId) || {};
      return {
        x: c.x,
        y: c.y,
        id: nodeId,
        label: node.label || (nodeId === 0 ? 'D' : `C${String(nodeId).padStart(2, '0')}`),
        demand: node.demand,
        isDepot: nodeId === 0
      };
    });

    datasets.push({
      label: `Route ${route.id}`,
      data: routePoints,
      borderColor: color,
      backgroundColor: color,
      showLine: true,
      fill: false,
      pointRadius: 6,
      pointHoverRadius: 9,
      pointBackgroundColor: routePoints.map(p => p.isDepot ? DEPOT_COLOR : color),
      pointBorderColor: '#0f172a',
      pointBorderWidth: 2,
      borderWidth: 3,
      tension: 0.15,
      order: 2,
      labelPoints: routePoints.map(p => p.label)
    });
  });

  const customers = allNodes.filter(n => !n.isDepot);
  datasets.push({
    label: 'Khách hàng',
    data: customers.map(n => ({ x: n.x, y: n.y, id: n.id, demand: n.demand })),
    backgroundColor: '#94a3b8',
    pointRadius: 7,
    pointHoverRadius: 10,
    showLine: false,
    order: 1
  });

  const depot = allNodes.find(n => n.isDepot);
  if (depot) {
    datasets.push({
      label: 'Depot',
      data: [{ x: depot.x, y: depot.y, label: 'D' }],
      backgroundColor: DEPOT_COLOR,
      pointRadius: 14,
      pointStyle: 'star',
      showLine: false,
      order: 0,
      labelPoints: ['Depot']
    });
  }

  routeStates.forEach((state, i) => {
    const color = COLORS[i % COLORS.length];
    datasets.push({
      label: `Xe ${state.id}`,
      data: [{ x: state.position.x, y: state.position.y }],
      backgroundColor: color,
      borderColor: '#0f172a',
      borderWidth: 3,
      pointRadius: 10,
      pointStyle: 'rectRot',
      showLine: false,
      order: 3
    });
    state.datasetIndex = datasets.length - 1;
  });

  chartInstance = new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    plugins: [pointLabelPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 500 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => {
              const p = context.raw;
              if (p.id !== undefined) {
                const label = p.label || `C${String(p.id).padStart(2, '0')}`;
                return `${label} (${p.x.toFixed(1)}, ${p.y.toFixed(1)})${p.demand !== undefined ? ` • demand=${p.demand}` : ''}`;
              }
              return `(${p.x?.toFixed(1)}, ${p.y?.toFixed(1)})`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#1f2937' },
          ticks: { color: '#6b7280', font: { family: 'monospace', size: 10 } }
        },
        y: {
          grid: { color: '#1f2937' },
          ticks: { color: '#6b7280', font: { family: 'monospace', size: 10 } }
        }
      }
    }
  });
}

function updateVehiclePositions(elapsed) {
  if (!chartInstance) return;
  routeStates.forEach(state => {
    const finished = elapsed >= state.duration;
    state.position = getPositionAt(state, elapsed);
    if (finished && !state.finished) {
      state.finished = true;
      state.finishTime = elapsed;
    }
    const dataset = chartInstance.data.datasets[state.datasetIndex];
    if (dataset) dataset.data = [{ x: state.position.x, y: state.position.y }];
  });
  chartInstance.update('none');
}

function updateArrivalPanel(elapsed = 0) {
  const panel = document.getElementById('arrivalPanel');
  const content = document.getElementById('arrivalContent');
  if (!routeStates.length) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'grid';
  const sorted = routeStates.slice().sort((a, b) => b.totalDistance - a.totalDistance);
  const longest = sorted[0];
  const shortest = sorted[sorted.length - 1];
  content.innerHTML = `<div style="grid-column:1/-1;padding:10px 12px;border-radius:10px;background:#111827;border:1px solid var(--border);margin-bottom:10px">
      <div style="font-size:12px;font-weight:700;color:var(--accent)">Tổng quan lộ trình</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Dài nhất: Xe ${longest.id} • ${longest.totalDistance.toFixed(2)} đơn vị</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">Ngắn nhất: Xe ${shortest.id} • ${shortest.totalDistance.toFixed(2)} đơn vị</div>
    </div>` + sorted.map(state => {
    const running = elapsed < state.duration;
    const timeValue = state.finishTime !== null ? state.finishTime : Math.min(elapsed, state.duration);
    return `<div style="padding:8px 10px;background:#111827;border:1px solid var(--border);border-radius:8px">
      <div style="font-weight:700;color:${COLORS[(state.id - 1) % COLORS.length]}">Xe ${state.id}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Lộ trình: <strong>${state.totalDistance.toFixed(2)}</strong> đơn vị</div>
      <div style="font-size:11px;color:var(--muted)">Thời gian: <strong>${formatMs(timeValue)}</strong></div>
      <div style="font-size:11px;color:${running ? '#fbbf24' : '#34d399'}">${running ? 'Đang di chuyển' : 'Đã hoàn thành'}</div>
    </div>`;
  }).join('');
}

function animateFrame(timestamp) {
  if (!animationStart) animationStart = timestamp;
  const elapsed = timestamp - animationStart;
  updateVehiclePositions(elapsed);
  updateArrivalPanel(elapsed);

  const allDone = routeStates.every(s => elapsed >= s.duration);
  if (allDone) {
    animationFrame = null;
    document.getElementById('animateBtn').textContent = '🚗 Chạy tour';
    return;
  }
  animationFrame = requestAnimationFrame(animateFrame);
}

function startAnimation() {
  if (!routeStates.length) return;
  routeStates.forEach(state => {
    state.finished = false;
    state.finishTime = null;
    state.position = { x: state.route.coords[0].x, y: state.route.coords[0].y };
  });
  animationStart = null;
  document.getElementById('animateBtn').textContent = '⏸ Dừng';
  animationFrame = requestAnimationFrame(animateFrame);
}

function stopAnimation() {
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }
  animationStart = null;
  document.getElementById('animateBtn').textContent = '🚗 Chạy tour';
}

function toggleAnimation() {
  if (animationFrame) {
    stopAnimation();
    return;
  }
  startAnimation();
}

function updateSpeed() {
  const slider = document.getElementById('speedSlider');
  const valueDisplay = document.getElementById('speedValue');
  speedMultiplier = parseFloat(slider.value);
  valueDisplay.textContent = speedMultiplier.toFixed(1) + 'x';
  
  if (!routeStates.length) return;
  
  const baseDuration = routeStates[0].baseDuration;
  routeStates.forEach(state => {
    state.duration = Math.round(state.baseDuration / speedMultiplier);
  });
  
  if (animationFrame) {
    stopAnimation();
    startAnimation();
  }
}

// ═══════════════════════════════════════════════════════════════
//  ROUTE LIST
// ═══════════════════════════════════════════════════════════════
function renderRouteList(data) {
  const el = document.getElementById('routeList');
  el.innerHTML = data.routes.map((r, i) => {
    const color = COLORS[i % COLORS.length];
    const pathStr = '0 → ' + r.customers.join(' → ') + ' → 0';
    const state = routeStates.find(s => s.id === r.id);
    const distText = state ? state.totalDistance.toFixed(2) : '—';
    const timeText = state ? formatMs(state.duration) : '—';
    return `
      <div class="route-item" style="border-left-color:${color}">
        <div class="route-title" style="color:${color}">Route ${r.id}</div>
        <div class="route-path">${pathStr}</div>
        <div class="route-meta">
          <span class="badge badge-blue">dist ${r.cost.toFixed(2)}</span>
          <span class="badge badge-green">load ${r.load}</span>
          <span class="badge badge-blue">route ${distText}</span>
          <span class="badge badge-blue">time ${timeText}</span>
        </div>
      </div>`;
  }).join('');
}

function renderLegend(routes) {
  const el = document.getElementById('legend');
  el.innerHTML = routes.map((r, i) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <span style="width:14px;height:3px;background:${COLORS[i%COLORS.length]};display:inline-block;border-radius:2px"></span>
      <span style="font-size:11px;color:var(--muted)">Route ${r.id} — ${r.customers.length} khách</span>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
loadResult();
</script>
